[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visibility"
version = "0.1.0"
description = "A local-first, agent-ready observability, audit, and cost-guardrail SDK for AI agents and LLM applications."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Visibility Contributors"}
]
keywords = [
    "observability",
    "ai-agents",
    "llm",
    "audit",
    "cost-tracking",
    "local-first"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
visibility = "visibility.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short -p no:warnings -p no:libtmux"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
    "ignore::UserWarning",
    "default::pytest.PytestCollectionWarning",
]
log_cli = false
log_cli_level = "WARNING"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
